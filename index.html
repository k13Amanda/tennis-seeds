<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Tennis Scheduler</title>
    <link rel="stylesheet" href="styles.css">

    <!-- Load LOCAL XLSX library (no CDN, no blocking) -->
    <script src="xlsx.full.min.js"></script>
</head>

<body>

    <!-- Division Buttons -->
    <section class="division-buttons">
        <button class="division-btn" data-division="MS Boys">MS Boys</button>
        <button class="division-btn" data-division="MS Girls">MS Girls</button>
        <button class="division-btn" data-division="Orange Ball">Orange Ball</button>
        <button class="division-btn" data-division="High School">High School</button>
    </section>

    <!-- Division Header -->
    <header class="division-header">
        <h1 id="divisionTitle">MS Boys Division</h1>
        <h2 class="subtitle">Match Entry & Seeding</h2>
    </header>

    <main>
        <!-- Match Info -->
        <section class="card">
            <h2>Match Information</h2>
            <div class="row">
                <label>
                    <span>Date</span>
                    <input type="date" id="matchDate">
                </label>
                <label>
                    <span>Team A</span>
                    <select id="teamASelect"></select>
                </label>
                <label>
                    <span>Team B</span>
                    <select id="teamBSelect"></select>
                </label>
            </div>
        </section>

        <!-- Excel Import -->
        <input type="file" id="excelUpload" accept=".xlsx,.xls" />
        <button id="importExcelBtn">Import Excel</button>

        <!-- Preview Window -->
        <div id="importPreview" style="display:none; padding:20px; border:2px solid #444; margin-top:20px;">
            <h2>Preview Import</h2>
            <div id="previewContent"></div>
            <button id="confirmImportBtn">Confirm Import</button>
            <button id="cancelImportBtn">Cancel</button>
        </div>

        <!-- Varsity Section -->
        <section class="card">
            <h2>Varsity</h2>
            <div id="varsitySpots" class="spots-grid"></div>
        </section>

        <!-- JV Section -->
        <section class="card">
            <h2>JV</h2>
            <div id="jvSpots" class="spots-grid"></div>
        </section>

        <section class="card actions">
            <button id="saveMatchBtn">Save Entire Match</button>
            <button id="clearAllBtn">Clear All Data</button>
        </section>

        <!-- Seeding Display -->
        <section class="card">
            <h2>Varsity Seeds</h2>
            <div id="varsitySeeds"></div>
        </section>

        <section class="card">
            <h2>JV Seeds</h2>
            <div id="jvSeeds"></div>
        </section>

        <!-- Matches List -->
        <section class="card">
            <h2>Saved Matches</h2>
            <div id="matchesList"></div>
        </section>

        <button id="exportSeedsBtn">Export All Leagues to Excel</button>
    </main>

    <!-- Your main JS file -->
    <script src="app.js"></script>
</body>

</html>
